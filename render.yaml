services:
  - type: web
    name: questboard
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run db:push && npm run db:seed && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_EMAIL_DOMAIN
        value: vitapstudent.ac.in
      - key: DATABASE_URL
        value: "file:./dev.db"
